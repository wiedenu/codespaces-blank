<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualizer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><rect x='2' y='9' width='2' height='5' fill='%2300d13c'/><rect x='5.5' y='5' width='2' height='9' fill='%238ce800'/><rect x='9' y='2' width='2' height='12' fill='%23ffd400'/><rect x='12.5' y='7' width='2' height='7' fill='%23ff3b1f'/></svg>">
<style>
:root {
  /* Overwritten by the active theme's chrome colors from main.js. */
  --bg: #000;
  --fg: #00d13c;
  --dim: #1f6b34;
  --accent: #ffd400;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: var(--mono);
  transition: background .4s ease;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ---------- status bar ---------- */

.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  border-top: 1px solid color-mix(in srgb, var(--dim) 45%, transparent);
  backdrop-filter: blur(8px);
  color: var(--fg);
  font-size: 12px;
  letter-spacing: .04em;
  transition: opacity .35s ease, transform .35s ease;
}

.bar.hidden {
  opacity: 0;
  transform: translateY(100%);
  pointer-events: none;
}

.bar label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--dim);
  text-transform: uppercase;
  font-size: 10px;
}

.bar select {
  font: inherit;
  font-size: 12px;
  text-transform: none;
  letter-spacing: 0;
  color: var(--fg);
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--dim) 70%, transparent);
  border-radius: 3px;
  padding: 4px 6px;
  max-width: 240px;
}

.bar select:focus-visible,
.bar button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* Native dropdown lists render on the OS surface, so they need explicit
   colors — inheriting the themed background leaves them unreadable. */
.bar select option { background: #101010; color: #e8e8e8; }

.bar button {
  font: inherit;
  font-size: 11px;
  color: var(--fg);
  background: transparent;
  border: 1px solid color-mix(in srgb, var(--dim) 70%, transparent);
  border-radius: 3px;
  padding: 5px 10px;
  cursor: pointer;
}

.bar button:hover { border-color: var(--accent); color: var(--accent); }

.meter {
  width: 90px;
  height: 6px;
  border: 1px solid color-mix(in srgb, var(--dim) 70%, transparent);
  border-radius: 2px;
  overflow: hidden;
}

.meter i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width .06s linear;
}

.spacer { flex: 1; }

.hint { color: var(--dim); font-size: 10px; }

#bpm {
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  min-width: 62px;
}

/* ---------- overlays ---------- */

#gate {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  background: #000;
  color: #00d13c;
  cursor: pointer;
  z-index: 3;
}

#gate h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
}

#gate p { margin: 0; color: #1f6b34; font-size: 12px; max-width: 30ch; text-align: center; line-height: 1.6; }

#gate span {
  border: 1px solid #1f6b34;
  border-radius: 3px;
  padding: 8px 22px;
  font-size: 12px;
  letter-spacing: .1em;
}

#gate:hover span { border-color: #ffd400; color: #ffd400; }

#toast {
  position: fixed;
  left: 50%;
  bottom: 68px;
  transform: translateX(-50%);
  max-width: min(560px, 88vw);
  padding: 10px 16px;
  background: rgba(8, 8, 8, .94);
  border: 1px solid var(--dim);
  border-radius: 4px;
  color: var(--fg);
  font-size: 12px;
  line-height: 1.55;
  text-align: center;
  z-index: 2;
}

#toast.err { border-color: #e0553f; color: #ffb2a3; }

[hidden] { display: none !important; }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="bar" class="bar">
  <label>Source
    <select id="source">
      <option value="tone">Test tone</option>
      <option value="display">System / tab audio</option>
      <option value="device">Input device</option>
    </select>
  </label>

  <label id="deviceRow" hidden>Device
    <select id="device"></select>
  </label>

  <label>Level <span class="meter"><i id="level"></i></span></label>

  <span id="bpm">--</span>

  <div class="spacer"></div>

  <span class="hint">1-5 theme &middot; &larr;&rarr; mode &middot; F full</span>

  <label>Theme <select id="theme"></select></label>
  <label>Mode <select id="mode"></select></label>

  <button id="full" type="button">Fullscreen</button>
</div>

<div id="toast" hidden></div>

<div id="gate">
  <h1>Visualizer</h1>
  <p>Starts on a built-in test tone. Switch the source to system audio once it's running.</p>
  <span>Click to start</span>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
